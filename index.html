
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conheça nosso site e descubra nossas soluções.">
    <title>Universo Marvel| Página Oficial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000000;
            color: #ff0000;
        }

        header {
            background: #000000;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #ff0000;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            transition: 0.3s;
        }

        nav a:hover {
            color: rgb(255, 0, 0);
        }

        .hero {
            min-height: 520px;
            padding: 100px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(135deg, #000000, #ff0404);
            color: white;
        }

        .hero h1 {
            font-size: clamp(35px, 5vw, 58px);
            max-width: 700px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #ffffff;
            color: #000000;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: translateY(-3px);
        }

        section {
            padding: 80px 8%;
            text-align: center;
        }

        section h2 {
            font-size: 34px;
            margin-bottom: 20px;
            color: #000000;
        }

        section p {
            line-height: 1.7;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
        }

        .card h3 {
            color: #000000;
            margin-bottom: 15px;
        }

        #contato {
            background: #eaf0f8;
        }

        footer {
            background: #000000;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .hero {
                padding: 80px 7%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="https://www.guiadasemana.com.br/contentFiles/system/pictures/2015/12/148951/original/logo.jpg">Univer Marvel </div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#sobre">Sobre</a>
            <a href="#servicos">Filmes</a>
            <a href="#contato">Heróis</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="inicio">
            <h1>Bem-vindo ao Universo Marvel!</h1>

            </p>

            </div>


            </a>
        </section>
    </main>

    <footer>



        <p>© 2026 Universo Marvel- Todos os direitos reservados.</p>
    </footer>

</body>
</html>
